name: Build LEEl VPN Android APK
on:
  workflow_dispatch:
  push:
    tags: ['leel-v*']
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: ./.github/actions/setup-flutter
        with:
          platform: android-apk
          generated-code: 'false'
      - name: Build APK
        run: make android-apk-release
      - name: Collect universal APK
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk out/LEEl-VPN-Android-universal.apk
      - uses: actions/upload-artifact@v4
        with:
          name: leel-vpn-android
          path: out/LEEl-VPN-Android-universal.apk
      - name: Publish tagged release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/LEEl-VPN-Android-universal.apk
          generate_release_notes: true
